name: Poll Google Scrape Results

on:
  schedule:
    # Tue/Thu at 2:30am Central (7:30am UTC)
    - cron: '30 7 * * 2,4'
    # Tue/Thu at 3:00am Central (8:00am UTC)
    - cron: '0 8 * * 2,4'
    # Tue/Thu at 3:30am Central (8:30am UTC)
    - cron: '30 8 * * 2,4'
    # Tue/Thu at 4:00am Central (9:00am UTC)
    - cron: '0 9 * * 2,4'
    # Tue/Thu at 4:30am Central (9:30am UTC)
    - cron: '30 9 * * 2,4'
    # Tue/Thu at 5:00am Central (10:00am UTC)
    - cron: '0 10 * * 2,4'
    # Tue/Thu at 5:30am Central (10:30am UTC)
    - cron: '30 10 * * 2,4'
    # Tue/Thu at 6:00am Central (11:00am UTC)
    - cron: '0 11 * * 2,4'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  poll-google-results:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll for Google scrape results
        env:
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          SHORTIO_DOMAIN: ${{ secrets.SHORTIO_DOMAIN }}
        run: |
          python poll_google_results.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poll-logs-${{ github.run_number }}
          path: |
            *.log
            *.txt
          retention-days: 7
