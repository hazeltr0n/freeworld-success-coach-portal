name: Poll Google Scrape Results

on:
  schedule:
    # Mon-Fri - Every 1.5 hours for 12 hours after 2am scrape (handles 6+ hour Outscraper delays)
    # 3:30am Central (8:30am UTC)
    - cron: '30 8 * * 1-5'
    # 5:00am Central (10:00am UTC)
    - cron: '0 10 * * 1-5'
    # 6:30am Central (11:30am UTC)
    - cron: '30 11 * * 1-5'
    # 8:00am Central (1:00pm UTC)
    - cron: '0 13 * * 1-5'
    # 9:30am Central (2:30pm UTC)
    - cron: '30 14 * * 1-5'
    # 11:00am Central (4:00pm UTC)
    - cron: '0 16 * * 1-5'
    # 12:30pm Central (5:30pm UTC)
    - cron: '30 17 * * 1-5'
    # 2:00pm Central (7:00pm UTC) - 12 hours after scrape start
    - cron: '0 19 * * 1-5'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  poll-google-results:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max - allows time to download and process large batches

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll for Google scrape results
        env:
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          SHORTIO_DOMAIN: ${{ secrets.SHORTIO_DOMAIN }}
          # Email notification settings (SMTP)
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python poll_google_results.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poll-logs-${{ github.run_number }}
          path: |
            *.log
            *.txt
          retention-days: 7
