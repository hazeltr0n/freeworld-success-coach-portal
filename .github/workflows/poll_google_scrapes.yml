name: Poll Google Scrape Results (DISABLED - Using JSearch instead)

on:
  # DISABLED: Outscraper polling no longer needed - using JSearch for Google Jobs
  # schedule:
  #   # Mon-Fri - Every 1.5 hours for 12 hours after 2am scrape (handles 6+ hour Outscraper delays)
  #   - cron: '30 8 * * 1-5'
  #   - cron: '0 10 * * 1-5'
  #   - cron: '30 11 * * 1-5'
  #   - cron: '0 13 * * 1-5'
  #   - cron: '30 14 * * 1-5'
  #   - cron: '0 16 * * 1-5'
  #   - cron: '30 17 * * 1-5'
  #   - cron: '0 19 * * 1-5'
  workflow_dispatch:  # Keep manual trigger for legacy testing if needed

jobs:
  poll-google-results:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max - allows time to download and process large batches

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll for Google scrape results
        env:
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          SHORTIO_DOMAIN: ${{ secrets.SHORTIO_DOMAIN }}
          # Email notification settings (SMTP)
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python poll_google_results.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poll-logs-${{ github.run_number }}
          path: |
            *.log
            *.txt
          retention-days: 7
