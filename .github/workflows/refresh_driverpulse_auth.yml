name: Refresh DriverPulse Authentication

on:
  # schedule:
  #   # Run every day at 2 AM UTC (9 PM EST)
  #   - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies for auth
        run: |
          pip install -r requirements-auth.txt

      - name: Create Gmail credentials file
        run: |
          echo '${{ secrets.DRIVER_PULSE_GMAIL_CREDENTIALS }}' > gmail_credentials.json

      - name: Create Gmail token file
        run: |
          echo '${{ secrets.DRIVER_PULSE_GMAIL_TOKEN }}' > gmail_token.json

      - name: Run auth refresh script
        env:
          DRIVER_PULSE_EMAIL: ${{ secrets.DRIVER_PULSE_EMAIL }}
          DRIVER_PULSE_FIRST_NAME: ${{ secrets.DRIVER_PULSE_FIRST_NAME }}
          DRIVER_PULSE_LAST_NAME: ${{ secrets.DRIVER_PULSE_LAST_NAME }}
          DRIVER_PULSE_PHONE: ${{ secrets.DRIVER_PULSE_PHONE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python refresh_driverpulse_auth.py --headless

      - name: Run DriverPulse scraper (immediately after auth)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Scrape from same IP that just created auth
          python -c "
          from driver_pulse_source import DriverPulseSource
          import json

          source = DriverPulseSource()
          source.load_authentication()

          # Search for CDL jobs
          results = source.search_jobs('CDL driver', max_results=100)

          print(f'✅ Found {len(results)} jobs from DriverPulse')

          # Save to file for artifact
          with open('driverpulse_jobs.json', 'w') as f:
              json.dump(results, f, indent=2)
          "

      - name: Upload results (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-and-scrape-logs
          path: |
            *.png
            auth.json
            driverpulse_jobs.json
          retention-days: 7
