name: Run DriverPulse Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID from async_job_queue'
        required: true
        type: string

jobs:
  execute-driverpulse-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Gmail credentials file
        run: |
          echo '${{ secrets.DRIVER_PULSE_GMAIL_CREDENTIALS }}' > gmail_credentials.json

      - name: Create Gmail token file
        run: |
          echo '${{ secrets.DRIVER_PULSE_GMAIL_TOKEN }}' > gmail_token.json

      - name: Refresh Gmail token
        continue-on-error: true
        run: |
          python -c "
          from driver_pulse_2fa import GmailCodeExtractor

          print('🔍 Refreshing Gmail token...')
          extractor = GmailCodeExtractor()
          if extractor.setup_gmail_api():
              print('✅ Gmail token refreshed and ready')
          else:
              print('⚠️ Gmail token refresh failed - will attempt to continue')
          "

      - name: Update job status to processing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          from supabase import create_client
          import os
          from datetime import datetime, timezone

          client = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_ANON_KEY'))

          client.table('async_job_queue').update({
              'status': 'processing',
              'started_at': datetime.now(timezone.utc).isoformat()
          }).eq('id', '${{ inputs.job_id }}').execute()

          print('✅ Job status updated to processing')
          "

      - name: Get job parameters from Supabase
        id: get_job_params
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          from supabase import create_client
          import os
          import json

          client = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_ANON_KEY'))

          result = client.table('async_job_queue').select('*').eq('id', '${{ inputs.job_id }}').execute()

          if not result.data:
              raise Exception('Job not found')

          job = result.data[0]
          params = job.get('search_params', {})

          # Write params to file for next step
          with open('job_params.json', 'w') as f:
              json.dump(params, f)

          print(f\"✅ Job params retrieved: {json.dumps(params, indent=2)}\")
          "

      - name: Refresh DriverPulse authentication
        env:
          DRIVER_PULSE_EMAIL: ${{ secrets.DRIVER_PULSE_EMAIL }}
          DRIVER_PULSE_FIRST_NAME: ${{ secrets.DRIVER_PULSE_FIRST_NAME }}
          DRIVER_PULSE_LAST_NAME: ${{ secrets.DRIVER_PULSE_LAST_NAME }}
          DRIVER_PULSE_PHONE: ${{ secrets.DRIVER_PULSE_PHONE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python refresh_driverpulse_auth.py --headless

      - name: Run DriverPulse scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          SHORTIO_DOMAIN: ${{ secrets.SHORTIO_DOMAIN }}
        run: |
          python -c "
          from driver_pulse_adapter import DriverPulsePipelineIntegration
          import json

          # Load job params
          with open('job_params.json', 'r') as f:
              params = json.load(f)

          integration = DriverPulsePipelineIntegration()

          # Extract search parameters
          search_terms = params.get('search_terms', 'CDL driver')
          filter_settings = params.get('filter_settings', {})
          coach_username = params.get('coach_username', '')

          print(f'🔍 Searching DriverPulse: {search_terms}')
          print(f'🎯 Filter mode: {filter_settings.get(\"filter_mode\", \"all_markets\")}')
          if filter_settings.get('custom_zips'):
              print(f'📍 Target ZIPs: {len(filter_settings.get(\"custom_zips\"))} ZIP codes')

          # Run the scraper through pipeline
          result = integration.run_driver_pulse_through_pipeline(
              search_terms=search_terms,
              filter_settings=filter_settings,
              coach_username=coach_username
          )

          # Extract DataFrame and convert to dict for JSON serialization
          jobs_df = result.get('jobs_df')
          if jobs_df is not None:
              # Replace NaN/Inf with None for JSON compatibility
              import numpy as np
              jobs_df = jobs_df.replace([np.inf, -np.inf], None)
              jobs_df = jobs_df.where(jobs_df.notnull(), None)
              jobs_list = jobs_df.to_dict('records')
              print(f'✅ Found {len(jobs_list)} jobs from DriverPulse')
          else:
              jobs_list = []
              print(f'⚠️ No jobs found')

          # Save results to file
          with open('driverpulse_results.json', 'w') as f:
              json.dump(jobs_list, f, indent=2)
          "

      - name: Update job status to completed
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          from supabase import create_client
          import os
          import json
          from datetime import datetime, timezone

          client = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_ANON_KEY'))

          # Load results
          with open('driverpulse_results.json', 'r') as f:
              results = json.load(f)

          # Clean results recursively to remove any NaN/null values that might cause issues
          def clean_for_json(obj):
              if isinstance(obj, dict):
                  return {k: clean_for_json(v) for k, v in obj.items() if v is not None and v == v}  # v == v filters NaN
              elif isinstance(obj, list):
                  return [clean_for_json(item) for item in obj if item is not None and (not isinstance(item, float) or item == item)]
              elif isinstance(obj, float):
                  import math
                  if math.isnan(obj) or math.isinf(obj):
                      return None
                  return obj
              return obj

          cleaned_results = clean_for_json(results)

          # Count quality jobs (good/so-so ratings)
          quality_count = sum(1 for job in cleaned_results if job.get('ai.match') in ['good', 'so-so'])

          # Store counts in both result_data (for messages) and dedicated columns (for UI table)
          client.table('async_job_queue').update({
              'status': 'completed',
              'completed_at': datetime.now(timezone.utc).isoformat(),
              'result_count': len(cleaned_results),
              'quality_job_count': quality_count,
              'result_data': {
                  'job_count': len(cleaned_results),
                  'quality_job_count': quality_count,
                  'message': f'Successfully processed {len(cleaned_results)} jobs from DriverPulse ({quality_count} quality)'
              }
          }).eq('id', '${{ inputs.job_id }}').execute()

          print(f'✅ Job completed with {len(cleaned_results)} jobs')
          "

      - name: Update job status to failed
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          from supabase import create_client
          import os
          from datetime import datetime, timezone

          client = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_ANON_KEY'))

          client.table('async_job_queue').update({
              'status': 'failed',
              'completed_at': datetime.now(timezone.utc).isoformat(),
              'error_message': 'Workflow execution failed - check GitHub Actions logs'
          }).eq('id', '${{ inputs.job_id }}').execute()

          print('❌ Job marked as failed')
          "

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driverpulse-job-${{ inputs.job_id }}
          path: |
            *.png
            auth.json
            driverpulse_results.json
            job_params.json
          retention-days: 7
