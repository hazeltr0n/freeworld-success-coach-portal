name: Scheduled Config-Based Scrapes

on:
  schedule:
    # Mon/Wed/Fri at 2am Central (7am UTC) - Indeed + DriverPulse
    - cron: '0 7 * * 1,3,5'

  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  run-scrapes:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for all scrapes

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Gmail credentials for DriverPulse 2FA
        run: |
          echo '${{ secrets.DRIVER_PULSE_GMAIL_CREDENTIALS }}' > gmail_credentials.json
          echo '${{ secrets.DRIVER_PULSE_GMAIL_TOKEN }}' > gmail_token.json

      - name: Refresh DriverPulse authentication
        env:
          DRIVER_PULSE_EMAIL: ${{ secrets.DRIVER_PULSE_EMAIL }}
          DRIVER_PULSE_FIRST_NAME: ${{ secrets.DRIVER_PULSE_FIRST_NAME }}
          DRIVER_PULSE_LAST_NAME: ${{ secrets.DRIVER_PULSE_LAST_NAME }}
          DRIVER_PULSE_PHONE: ${{ secrets.DRIVER_PULSE_PHONE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python refresh_driverpulse_auth.py --headless

      - name: Run config-based scrapes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          SHORTIO_DOMAIN: ${{ secrets.SHORTIO_DOMAIN }}
          DRIVER_PULSE_EMAIL: ${{ secrets.DRIVER_PULSE_EMAIL }}
          DRIVER_PULSE_FIRST_NAME: ${{ secrets.DRIVER_PULSE_FIRST_NAME }}
          DRIVER_PULSE_LAST_NAME: ${{ secrets.DRIVER_PULSE_LAST_NAME }}
          DRIVER_PULSE_PHONE: ${{ secrets.DRIVER_PULSE_PHONE }}
          DRIVER_PULSE_GMAIL_CREDENTIALS: ${{ secrets.DRIVER_PULSE_GMAIL_CREDENTIALS }}
          DRIVER_PULSE_GMAIL_TOKEN: ${{ secrets.DRIVER_PULSE_GMAIL_TOKEN }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          python run_config_scrapes.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results-${{ github.run_number }}
          path: |
            *.log
            *.json
            *.png
          retention-days: 7
