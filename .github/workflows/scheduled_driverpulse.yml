name: Scheduled DriverPulse Scraper

on:
  schedule:
    # Daily at 1am Central (6am UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  driverpulse-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours max - rate-limited API calls are slower but don't get 429'd

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Test Gmail IMAP connection
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -c "
          from driver_pulse_2fa_imap import GmailIMAPCodeExtractor

          print('🔍 Testing Gmail IMAP connection...')
          extractor = GmailIMAPCodeExtractor()
          if extractor.connect():
              print('✅ Gmail IMAP ready - no OAuth token bullshit!')
              extractor.disconnect()
          else:
              print('❌ Gmail IMAP connection failed')
              exit(1)
          "

      - name: Refresh DriverPulse authentication
        env:
          DRIVER_PULSE_EMAIL: ${{ secrets.DRIVER_PULSE_EMAIL }}
          DRIVER_PULSE_FIRST_NAME: ${{ secrets.DRIVER_PULSE_FIRST_NAME }}
          DRIVER_PULSE_LAST_NAME: ${{ secrets.DRIVER_PULSE_LAST_NAME }}
          DRIVER_PULSE_PHONE: ${{ secrets.DRIVER_PULSE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python refresh_driverpulse_auth.py --headless

      - name: Run DriverPulse scraper
        env:
          DRIVER_PULSE_EMAIL: ${{ secrets.DRIVER_PULSE_EMAIL }}
          DRIVER_PULSE_FIRST_NAME: ${{ secrets.DRIVER_PULSE_FIRST_NAME }}
          DRIVER_PULSE_LAST_NAME: ${{ secrets.DRIVER_PULSE_LAST_NAME }}
          DRIVER_PULSE_PHONE: ${{ secrets.DRIVER_PULSE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          SHORTIO_DOMAIN: ${{ secrets.SHORTIO_DOMAIN }}
          # Email notification settings (uses same GMAIL_ADDRESS/GMAIL_APP_PASSWORD as IMAP)
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          python3 -c "
          import os
          from driver_pulse_adapter import DriverPulsePipelineIntegration
          from send_scrape_notification import (
              collect_job_stats_from_dataframe,
              send_detailed_scrape_report
          )

          print('🚛 Starting DriverPulse Scraper...')
          integration = DriverPulsePipelineIntegration()

          filter_settings = {
              'filter_mode': 'all_markets',
              'classifier_type': 'CDL Job Classifier'
          }

          result = integration.run_driver_pulse_through_pipeline(
              search_terms='CDL',
              filter_settings=filter_settings,
              coach_username='scheduled_driverpulse'
          )

          jobs_df = result.get('jobs_df')
          if jobs_df is not None and not jobs_df.empty:
              total_jobs = len(jobs_df)
              quality_jobs = len(jobs_df[jobs_df.get('ai.match', '').isin(['good', 'so-so'])]) if 'ai.match' in jobs_df.columns else 0
              print(f'✅ DriverPulse complete: {total_jobs} jobs ({quality_jobs} quality)')

              # Send notification email if configured
              notification_email = os.getenv('NOTIFICATION_EMAIL')
              if notification_email:
                  print(f'📧 Sending scrape report to {notification_email}...')
                  stats = collect_job_stats_from_dataframe(jobs_df)
                  stats['source_name'] = 'DriverPulse'
                  stats['markets_searched'] = ['All Markets']
                  stats['search_terms'] = ['CDL']
                  try:
                      success = send_detailed_scrape_report('DriverPulse Scheduled', stats, notification_email)
                      if success:
                          print('✅ Scrape report sent successfully')
                      else:
                          print('⚠️ Failed to send scrape report (non-fatal)')
                  except Exception as e:
                      print(f'⚠️ Error sending scrape report: {e} (non-fatal)')
              else:
                  print('ℹ️ NOTIFICATION_EMAIL not set, skipping scrape report')
          else:
              print('⚠️ No jobs found')
          "

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: driverpulse-logs-${{ github.run_number }}
          path: |
            *.log
            *.txt
          retention-days: 7
