name: Scheduled GovernmentJobs Scraper

on:
  schedule:
    # Mon/Wed/Fri at 2am Central (7am UTC)
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  scrape_governmentjobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run GovernmentJobs scraper through pipeline
        env:
          # GovernmentJobs credentials
          GOVERNMENT_JOBS_EMAIL: ${{ secrets.GOVERNMENT_JOBS_EMAIL }}
          GOVERNMENT_JOBS_PASSWORD: ${{ secrets.GOVERNMENT_JOBS_PASSWORD }}

          # OpenAI API
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          # Link tracking
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_DOMAIN: ${{ secrets.SHORT_DOMAIN }}

          # System config
          PIPELINE_VERSION: v3.1
          MEMORY_EXPIRY_HOURS: 72
        run: |
          python3 << 'EOF'
          from governmentjobs_adapter import GovernmentJobsPipelineIntegration

          print("=" * 80)
          print("🏛️  Scheduled GovernmentJobs.com Scraper - GitHub Actions")
          print("=" * 80)

          # Initialize integration
          integration = GovernmentJobsPipelineIntegration()

          # Run through pipeline with production settings
          result = integration.run_governmentjobs_through_pipeline(
              search_terms="CDL",
              filter_settings={
                  'filter_mode': 'all_markets',
                  'classifier_type': 'CDL Job Classifier'
              },
              coach_username="automated_scraper",
              keywords=["CDL"],
              max_pages_per_search=3  # 3 pages per market = ~600 jobs total
          )

          print("\n" + "=" * 80)
          print("✅ WORKFLOW COMPLETE")
          print("=" * 80)
          print(f"Total Jobs: {result['job_count']}")
          print(f"Quality Jobs: {result['quality_job_count']}")
          print(f"Run ID: {result['run_id']}")
          print("=" * 80)
          EOF

      - name: Upload results summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governmentjobs-scraper-results
          path: |
            *.csv
            *.json
          retention-days: 7
