name: Scheduled HonestJobs Fair-Chance Scraper

on:
  schedule:
    # Mon/Wed/Fri at 3am Central (8am UTC) - free API, run frequently
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  honestjobs-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max (lots of ZIP codes)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HonestJobs multi-market scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_DOMAIN: ${{ secrets.SHORT_DOMAIN }}
          # Email notification settings (SMTP)
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python run_scheduled_honestjobs.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: honestjobs-logs-${{ github.run_number }}
          path: |
            *.log
            *.txt
          retention-days: 7
