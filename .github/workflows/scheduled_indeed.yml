name: Scheduled Indeed Multi-Market Scraper

on:
  schedule:
    # Mon/Wed/Fri at 2am Central (7am UTC)
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  indeed-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 195  # 3h 15m max - allows time for large batches

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Indeed multi-market scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INDEED_API_KEY: ${{ secrets.INDEED_API_KEY }}
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_DOMAIN: ${{ secrets.SHORT_DOMAIN }}
        run: |
          python run_scheduled_indeed.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: indeed-logs-${{ github.run_number }}
          path: |
            *.log
            *.txt
          retention-days: 7
