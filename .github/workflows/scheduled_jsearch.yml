name: Scheduled JSearch Google Jobs Scraper

on:
  schedule:
    # Tue/Thu/Sat at 2am Central (7am UTC) - offset from Indeed/DriverPulse
    - cron: '0 7 * * 2,4,6'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  jsearch-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hours max

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run JSearch multi-market scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          SHORT_IO_API_KEY: ${{ secrets.SHORT_IO_API_KEY }}
          SHORT_DOMAIN: ${{ secrets.SHORT_DOMAIN }}
          # Email notification settings (SMTP)
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python run_scheduled_jsearch.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jsearch-logs-${{ github.run_number }}
          path: |
            *.log
            *.txt
          retention-days: 7
